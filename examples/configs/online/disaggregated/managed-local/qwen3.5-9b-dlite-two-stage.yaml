# Four 80 GB GPUs: TP1 capture on GPU 0, FSDP trainers on GPUs 1-3.
model:
  target_model_path: Qwen/Qwen3.5-9B
  target_backend: sglang
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  torch_dtype: bfloat16
  dlite_teacher_checkpoint_path: ./outputs/qwen3.5-9b-dlite-teacher-hf
data:
  train_data_path: ./cache/dataset/train.jsonl
  max_length: 4096
  chat_template: qwen3.5
  build_dataset_num_proc: 8
  cache_dir: ./cache
training:
  strategy: dlite
  dlite_mode: two_stage
  num_epochs: 8
  batch_size: 1
  accumulation_steps: 1
  fsdp_sharding: SHARD_GRAD_OP
  learning_rate: 0.0004
  warmup_ratio: 0.04
  max_grad_norm: 1.0
  attention_backend: flex_attention
  num_anchors: 512
  objective_chunk_blocks: 16
  dlite_final_ce_weight: 1.0
  dlite_l1_weight: 1.0
  dlite_base_ce_weight: 0.0
  loss_decay_gamma: null
  save_interval: 1000
  log_interval: 10
  seed: 42
  dlite_stage1_epochs: 1
  dlite_stage2_epochs: 6
  dlite_stage1_kl_weight: 1.0
tracking:
  report_to: none
run_id: qwen3.5-9b-dlite-two-stage
output_dir: ./outputs/qwen3.5-9b-dlite-two-stage
deployment:
  mode: disaggregated
  trainer:
    nnodes: 1
    nproc_per_node: 3
  disaggregated:
    control_dir: ./outputs/qwen3.5-9b-dlite-two-stage/control
    backend: mooncake
    managed_local:
      trainer_cuda_visible_devices:
      - '1'
      - '2'
      - '3'
      mooncake:
        protocol: tcp
        global_segment_size_bytes: 68719476736
        local_buffer_size_bytes: 1073741824
      capture_servers:
      - port: 30000
        cuda_visible_devices:
        - '0'
        tp_size: 1
        mem_fraction_static: 0.85
